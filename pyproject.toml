[build-system]                                                                           
  requires = ["hatchling"]                                                                 
  build-backend = "hatchling.build"                                                        
                  
  [project]
  name = "terrain-diffusion"
  version = "0.1.0"
  requires-python = ">=3.11"
  dependencies = [                                                                         
      "torch>=2.3",
      "torchvision>=0.18",                                                                 
      "numpy>=1.26",
      "pyyaml>=6.0",
      "tqdm>=4.66",
      "matplotlib>=3.8",                                                                   
      "einops>=0.7",
      "huggingface_hub>=0.23",
  ]                                                                                        
                  
  [project.optional-dependencies]
  train = [
      "bitsandbytes>=0.43",
  ]
  data = [
    "rasterio>=1.5"
  ]

  [tool.hatch.build.targets.wheel]                                                         
  packages = ["model"]